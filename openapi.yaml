openapi: 3.0.0
info:
  title: Medium Clone API
  description: API for a Medium.com-like blogging platform
  version: 1.0.0
servers:
  - url: /
    description: Local development server

tags:
  - name: Users
    description: Operations about users
  - name: Articles
    description: Operations about articles
  - name: Tags
    description: Operations about tags
  - name: Sessions
    description: Authentication operations

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        password:
          type: string
        bio:
          type: string
        avatar:
          type: string
      required:
        - id
        - username
        - email
        - password
        - bio
        - avatar

    Tag:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
      required:
        - id
        - name

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
        - token
        - user

    Article:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        authorId:
          type: string
        createdAt:
          type: string
          format: date-time
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
      required:
        - id
        - title
        - content
        - authorId
        - createdAt

paths:
  /sessions:
    post:
      tags:
        - Sessions
      summary: Create a new session (login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "user@example.com"
              password: "password123"
      responses:
        '201':
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid credentials
    delete:
      tags:
        - Sessions
      summary: Delete session (logout)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session deleted successfully
        '401':
          description: Authentication required

  /users:
    get:
      tags:
        - Users
      summary: Get all users
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags:
        - Users
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
            example:
              username: "johndoe"
              email: "john@example.com"
              password: "securepassword123"
              bio: "Software developer"
              avatar: "https://example.com/avatar.jpg"
      responses:
        '201':
          description: User created successfully
          headers:
            Location:
              schema:
                type: string
              description: URL of the newly created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
    put:
      tags:
        - Users
      summary: Update a user by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
            example:
              username: "johndoe_updated"
              email: "john.new@example.com"
              bio: "Senior software developer"
              avatar: "https://example.com/new-avatar.jpg"
      responses:
        '200':
          description: User updated successfully
        '404':
          description: User not found
    patch:
      tags:
        - Users
      summary: Partially update a user by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                bio:
                  type: string
                avatar:
                  type: string
            example:
              bio: "Updated bio only"
      responses:
        '200':
          description: User updated successfully
        '404':
          description: User not found
    delete:
      tags:
        - Users
      summary: Delete a user by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted successfully
        '404':
          description: User not found

  /articles:
    get:
      tags:
        - Articles
      summary: Get all articles
      responses:
        '200':
          description: A list of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
    post:
      tags:
        - Articles
      summary: Create a new article
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Article'
            example:
              title: "How to Build APIs"
              content: "This article explains how to build RESTful APIs..."
              authorId: "507f1f77bcf86cd799439011"
      responses:
        '201':
          description: Article created successfully
          headers:
            Location:
              schema:
                type: string
              description: URL of the newly created article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'

  /articles/{id}:
    get:
      tags:
        - Articles
      summary: Get an article by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Article found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found
    put:
      tags:
        - Articles
      summary: Update an article by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Article'
            example:
              title: "Updated: How to Build APIs"
              content: "This updated article explains..."
              authorId: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Article updated successfully
        '404':
          description: Article not found
    patch:
      tags:
        - Articles
      summary: Partially update an article by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
                authorId:
                  type: string
            example:
              title: "New Title Only"
      responses:
        '200':
          description: Article updated successfully
        '404':
          description: Article not found
    delete:
      tags:
        - Articles
      summary: Delete an article by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Article deleted successfully
        '404':
          description: Article not found

  /tags:
    get:
      tags:
        - Tags
      summary: Get all tags
      responses:
        '200':
          description: A list of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
    post:
      tags:
        - Tags
      summary: Create a new tag
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tag'
            example:
              name: "javascript"
              description: "JavaScript programming language"
      responses:
        '201':
          description: Tag created successfully
          headers:
            Location:
              schema:
                type: string
              description: URL of the newly created tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'

  /tags/{id}:
    get:
      tags:
        - Tags
      summary: Get a tag by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tag found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '404':
          description: Tag not found
    put:
      tags:
        - Tags
      summary: Update a tag by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tag'
            example:
              name: "updated-javascript"
              description: "Updated JavaScript description"
      responses:
        '200':
          description: Tag updated successfully
        '404':
          description: Tag not found
    patch:
      tags:
        - Tags
      summary: Partially update a tag by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
            example:
              description: "Updated description only"
      responses:
        '200':
          description: Tag updated successfully
        '404':
          description: Tag not found
    delete:
      tags:
        - Tags
      summary: Delete a tag by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tag deleted successfully
        '404':
          description: Tag not found

  /articles/{id}/tags:
    get:
      tags:
        - Articles
        - Tags
      summary: Get all tags for an article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of tags for the article
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
        '404':
          description: Article not found
    post:
      tags:
        - Articles
        - Tags
      summary: Add tags to an article
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                description: Tag IDs to add to the article
            example: ["507f1f77bcf86cd799439011", "507f1f77bcf86cd799439012"]
      responses:
        '200':
          description: Tags added successfully
        '404':
          description: Article or tag not found
    delete:
      tags:
        - Articles
        - Tags
      summary: Remove tags from an article
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                description: Tag IDs to remove from the article
            example: ["507f1f77bcf86cd799439011"]
      responses:
        '200':
          description: Tags removed successfully
        '404':
          description: Article or tag not found
